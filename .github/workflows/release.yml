name: Release Desktop Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Get app version
        id: ver
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # The desktop app syncs through the web server (NEXT_PUBLIC_API_BASE_URL)
      # with each login's own session; it carries no database token. Without
      # the address the installed app can't sign in on a new computer, so
      # refuse to publish such a build.
      - name: Check server address
        env:
          API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if (-not $env:API_BASE_URL) {
            Write-Error "Repository secret NEXT_PUBLIC_API_BASE_URL must be set to the web server, e.g. https://mavin.pk (Settings > Secrets and variables > Actions)."
            exit 1
          }
        shell: pwsh

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.ver.outputs.VERSION }}
          releaseName: 'MAVIN.pk v${{ steps.ver.outputs.VERSION }}'
          releaseBody: 'New version of MAVIN.pk. The desktop app will update automatically.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
